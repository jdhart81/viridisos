name: viridisos-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run reference-runtime tests
        run: bash run_all_tests.sh
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps dist/viridisos_reference-*.whl
      - name: Verify installed research intake
        working-directory: /tmp
        run: |
          python - <<'PY'
          from runtime.research_registry import ResearchRegistry

          rows = ResearchRegistry().records()
          assert len(rows) == 7
          assert all(row.state == "BACKLOG_NO_WRAPPER" for row in rows)
          print("installed research intake: PASS")
          PY
