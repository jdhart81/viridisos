[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viridisos-reference"
version = "0.1.3"
description = "Open reference runtime for DOI-backed Viridis decision modules"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Justin D. Hart"}]
keywords = ["formal verification", "conservation", "decision support", "Lean"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Research = "https://github.com/jdhart81/viridis-canon"

[project.scripts]
viridisos-demo = "demo:main"

[tool.setuptools]
py-modules = ["catalog", "demo", "viridis_platform"]

[tool.setuptools.packages.find]
include = ["api*", "certification*", "modules*", "runtime*"]
exclude = ["integration*"]

[tool.setuptools.package-data]
runtime = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
